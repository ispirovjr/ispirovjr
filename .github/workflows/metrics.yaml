name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Updates every day at midnight
  workflow_dispatch: # Allows manual refresh
push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ispirovjr
          template: classic
          base: header, community, repositories, metadata
          config_timezone: Europe/Sofia # Adjust to your timezone
